name: offline_video_feed
description: A fully offline vertical video feed with local creator profiles.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cross_file: ^0.3.5
  image_picker: ^1.2.4
  path_provider: ^2.1.5
  photo_manager: ^3.12.0
  provider: ^6.1.5+1
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
