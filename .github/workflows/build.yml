name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Scaffold android and merge
        run: |
          flutter create app --platforms android --project-name offline_video_feed --org com.rejwane
          rm -rf app/lib && cp -r lib app/lib
          cp pubspec.yaml app/pubspec.yaml
          python3 - <<'PY'
          p='app/android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms='''<uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <application'''
          s=s.replace('<application',perms,1)
          open(p,'w').write(s)
          PY
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: offline-video-feed-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
